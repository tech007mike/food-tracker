<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Food Tracker</h1>
    <input type="text" id="foodInput" placeholder="Enter a food name">
    <button onclick="addFood()">Add Food</button>

    <ul id="foodList"></ul>

    <!-- Firebase -->
    <script type="module">
        // Firebase SDK import from Firebase's CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Your Firebase config (replace with your own from Firebase console)
        const firebaseConfig = {
  apiKey: "AIzaSyDuCENnAnqyDZvupS8aZbsDrIi80_60OfE",
  authDomain: "test-run-8-9-25.firebaseapp.com",
  projectId: "test-run-8-9-25",
  storageBucket: "test-run-8-9-25.firebasestorage.app",
  messagingSenderId: "160977456975",
  appId: "1:160977456975:web:9b41948064bd4563207f3a"
};

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Load foods when page opens
        async function loadFoods() {
            const querySnapshot = await getDocs(collection(db, "foods"));
            querySnapshot.forEach((doc) => {
                const li = document.createElement("li");
                li.textContent = doc.data().name;
                document.getElementById("foodList").appendChild(li);
            });
        }

        // Add food to Firestore
        async function addFood() {
            const foodName = document.getElementById("foodInput").value;
            if (!foodName) return alert("Please enter a food name");

            await addDoc(collection(db, "foods"), { name: foodName });
            location.reload();
        }

        loadFoods();
    </script>

</body>
</html>
